# The repository's one gate (scripts/verify.sh) on every pull request and every push to main:
# acceptance documents, shell scripts, formatting, vet, staticcheck, build, the unit tests, the
# website built from the docs, and the menu bar app built and tested. The journeys (the end-to-end
# tests) need a Docker engine and real terminals, and run on a developer's machine
# (CONTRIBUTING.md).
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The gate's tools
        run: |
          npm install -g criteria-review
          brew install shellcheck zellij
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: scripts/verify.sh
        run: scripts/verify.sh
